version: "3.8"

services:
  backend:
    build: ./backend
    container_name: demucs_backend
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./backend/public:/app/backend/public
    depends_on:
      - db
      - demucs
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: demucs_db

  db:
    image: mysql:8.0
    container_name: demucs_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: demucs_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  demucs:
    build: ./demucs
    container_name: demucs_cpu
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./backend/public:/app/backend/public
    environment:
      DEMUCS_MODEL: htdemucs_6s

volumes:
  db_data: